name: Windows Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (branch, tag, or SHA). Defaults to the current ref when left blank.
        required: false
        default: ''
      restore_only:
        description: Verify pinned build inputs without compiling or launching apps
        type: boolean
        default: false
      generate_lock:
        description: Generate the initial NuGet lock before verifying it
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-inputs:
    if: ${{ inputs.restore_only }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.420
      - name: Verify locked native inputs without compiling
        shell: pwsh
        run: |
          # Select the installed .NET 8 SDK even when the runner also has .NET 10.
          Set-Content global.json '{"sdk":{"version":"8.0.420","rollForward":"disable"}}'
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/test-windows-build-inputs.ps1')
          if ('${{ inputs.generate_lock }}' -eq 'true') { $arguments += '-GenerateLock' }
          & powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell input checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-inputs-${{ github.sha }}
          path: artifacts/windows-build-inputs
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    if: ${{ !inputs.restore_only }}
    name: Windows app smoke
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build CLI release binary
        run: cargo build --release -p nvpn

      - name: Install Windows native package dependencies
        run: choco install llvm innosetup -y --no-progress

      - name: Build Windows installer
        env:
          NVPN_WINDOWS_LLVM_BIN: C:\Program Files\LLVM\bin
        run: .\scripts\windows-build.ps1 -Configuration Release -Installer -Tag v0.0.0 -OutputDir dist

      - name: Smoke launch installed Windows app
        run: .\scripts\windows-installer-smoke.ps1 -InstallerPath dist\nostr-vpn-v0.0.0-windows-x64-setup.exe -ArtifactRoot artifacts

      - name: Package smoke artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $files = @(
            "target/release/nvpn.exe",
            "dist/nostr-vpn-v0.0.0-windows-x64-setup.exe",
            "artifacts/windows-app-launch-smoke.json"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Expected build output not found: $file"
            }
            $source = Resolve-Path $file
            $dist = Resolve-Path dist
            if ((Split-Path -Parent $source) -ne $dist) {
              Copy-Item $source dist/
            }
          }

          Compress-Archive -Path dist/* -DestinationPath artifacts/windows-smoke.zip -Force

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: artifacts/windows-smoke.zip
          retention-days: 7
