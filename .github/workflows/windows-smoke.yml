name: Windows Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (branch, tag, or SHA). Defaults to the current ref when left blank.
        required: false
        default: ''
      restore_only:
        description: Verify pinned build inputs without compiling or launching apps
        type: boolean
        default: false
      generate_lock:
        description: Generate the initial NuGet lock before verifying it
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  build-inputs:
    if: ${{ inputs.restore_only }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.420
      - name: Verify locked native inputs without compiling
        shell: pwsh
        run: |
          # Select the installed .NET 8 SDK even when the runner also has .NET 10.
          Set-Content global.json '{"sdk":{"version":"8.0.420","rollForward":"disable"}}'
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/test-windows-build-inputs.ps1')
          if ('${{ inputs.generate_lock }}' -eq 'true') { $arguments += '-GenerateLock' }
          & powershell.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell input checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-inputs-${{ github.sha }}
          path: artifacts/windows-build-inputs
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    if: ${{ !inputs.restore_only }}
    name: Windows app smoke
    timeout-minutes: 60
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.420

      - name: Verify production PowerShell build inputs before compiling
        run: |
          Set-Content global.json '{"sdk":{"version":"8.0.420","rollForward":"disable"}}'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-build-inputs.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell input checks failed' }

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Install Windows native package dependencies
        run: choco install llvm innosetup -y --no-progress

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Build CLI release binary
        run: cargo build --release -p nvpn --locked

      - name: Build Windows installer
        env:
          NVPN_WINDOWS_LLVM_BIN: C:\Program Files\LLVM\bin
        run: .\scripts\windows-build.ps1 -Configuration Release -Installer -OutputDir dist

      - name: Smoke launch installed and portable Windows apps
        env:
          NVPN_APP_DATA_DIR: ${{ runner.temp }}\nvpn-haps-profile
        run: |
          $publish = 'windows/NostrVpn.Windows/bin/Release/net8.0-windows/win-x64/publish'
          $installers = @(Get-ChildItem dist/nostr-vpn-*-windows-x64-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one source-bound Windows installer' }
          ./scripts/windows-installer-smoke.ps1 -InstallerPath $installers[0].FullName -ArtifactRoot artifacts/installed -PublishDir $publish
          ./scripts/windows-portable-smoke.ps1 -PublishDir $publish -InstallerPath $installers[0].FullName -InstalledManifestPath artifacts/installed/installed-files.json -ArtifactRoot artifacts/portable

      - name: Retain source-bound Windows artifacts
        run: |
          Copy-Item dist/nostr-vpn-*-windows-x64-setup.exe artifacts/portable/
          Compress-Archive -Path @('artifacts/portable/*.zip', 'artifacts/portable/*.json', 'artifacts/portable/*.exe', 'artifacts/portable/launch') -DestinationPath artifacts/windows-smoke.zip

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ github.sha }}
          path: artifacts/windows-smoke.zip
          if-no-files-found: error
          retention-days: 7
