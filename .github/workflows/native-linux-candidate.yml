name: Final 4.1.19 native Linux preparation
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Native x64 packages or native-smoked ARM64 CLI
        type: choice
        default: x64
        options: [x64, arm64]
permissions:
  contents: read
concurrency:
  group: nvpn-4119-final-native-linux-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.lane != 'arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4dfbc7f9b2f34168c932672b94877effa4034b33
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: mmalmi/fips
          ref: f98d97e42dfa48d5fed344c43caa9ebd27b01229
          fetch-depth: 0
          path: .hosted-fips
      - name: Verify exact final sources and prepare existing native driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4dfbc7f9b2f34168c932672b94877effa4034b33
          test "$(git rev-parse 'HEAD^{tree}')" = 3c227a4c74ab357a10585214d929079d61b904cb
          test -z "$(git diff --name-only HEAD)"
          test "$(git -C .hosted-fips rev-parse HEAD)" = f98d97e42dfa48d5fed344c43caa9ebd27b01229
          test "$(git -C .hosted-fips rev-parse 'HEAD^{tree}')" = dcb1c6d80de1e28a0f442e30cba8ddadb15dc581
          test -z "$(git -C .hosted-fips status --porcelain)"
          python3 - <<'DRIVER'
          import os,pathlib,hashlib,json
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          original=(root/'scripts/build-hosted-linux-candidate.sh').read_text()
          source=original
          old='ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"'
          assert source.count(old)==1
          source=source.replace(old,'ROOT="$GITHUB_WORKSPACE"')
          old='[[ "$fips_sha" == 12a7b154fa2fe8e86483c51ac10708501e50cdfe ]]'
          assert source.count(old)==1
          source=source.replace(old,'[[ "$fips_sha" == f98d97e42dfa48d5fed344c43caa9ebd27b01229 ]]')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'final-native-driver.sh'
          path.write_text(source)
          proof={'shippingSourceChanged':False,'appGitSha':'4dfbc7f9b2f34168c932672b94877effa4034b33','appGitTree':'3c227a4c74ab357a10585214d929079d61b904cb','fipsGitSha':'f98d97e42dfa48d5fed344c43caa9ebd27b01229','fipsGitTree':'dcb1c6d80de1e28a0f442e30cba8ddadb15dc581','originalDriverSha256':hashlib.sha256(original.encode()).hexdigest(),'executionDriverSha256':hashlib.sha256(source.encode()).hexdigest(),'changes':['external driver root','exact published FIPS 0.4.107 pin']}
          (path.parent/'final-native-driver.json').write_text(json.dumps(proof,indent=2)+'\n')
          DRIVER
          bash -n "$RUNNER_TEMP/final-native-driver.sh"
      - name: Reclaim unused SDKs on this dedicated runner
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build exact final Linux packages and native GTK check
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/final-native-driver.sh" "$GITHUB_WORKSPACE/.hosted-fips" "$RUNNER_TEMP/nvpn-linux-candidate" 2>&1 | tee "$RUNNER_TEMP/final-native-build.log"
          test "$(git rev-parse HEAD)" = 4dfbc7f9b2f34168c932672b94877effa4034b33
          test -z "$(git diff --name-only HEAD)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-native-linux-4dfbc7f9b2f34168c932672b94877effa4034b33
          path: |
            ${{ runner.temp }}/nvpn-linux-candidate
            ${{ runner.temp }}/final-native-build.log
            ${{ runner.temp }}/final-native-driver.json
            ${{ runner.temp }}/final-native-driver.sh
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  arm64:
    if: inputs.lane == 'arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4dfbc7f9b2f34168c932672b94877effa4034b33
          fetch-depth: 0
          path: app
      - uses: actions/checkout@v6
        with:
          repository: mmalmi/fips
          ref: f98d97e42dfa48d5fed344c43caa9ebd27b01229
          fetch-depth: 0
          path: fips
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - name: Prepare canonical ARM64 build and native smoke
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = 4dfbc7f9b2f34168c932672b94877effa4034b33
          test "$(git rev-parse 'HEAD^{tree}')" = 3c227a4c74ab357a10585214d929079d61b904cb
          test -z "$(git status --porcelain --untracked-files=all)"
          docker info --format '{{.OSType}}/{{.Architecture}}'
          docker pull --platform linux/arm64 ubuntu:24.04
          echo "NVPN_REAL_DOCKER=$(command -v docker)" >> "$GITHUB_ENV"
          python3 - <<'WRAPPER'
          import base64,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'nvpn-bounded-bin'
          directory.mkdir()
          path=directory/'docker'
          path.write_bytes(base64.b64decode(''))
          path.chmod(0o755)
          with open(os.environ['GITHUB_PATH'],'a') as stream:stream.write(str(directory)+'\n')
          WRAPPER
      - name: Build canonical ARM64 CLI and run native smoke
        working-directory: app
        shell: bash
        env:
          NVPN_FIPS_REPO_PATH: ${{ github.workspace }}/fips
          NVPN_EXPECTED_APP_GIT_SHA: 4dfbc7f9b2f34168c932672b94877effa4034b33
          NVPN_EXPECTED_APP_GIT_TREE: 3c227a4c74ab357a10585214d929079d61b904cb
          NVPN_EXPECTED_FIPS_GIT_SHA: f98d97e42dfa48d5fed344c43caa9ebd27b01229
          NVPN_EXPECTED_FIPS_GIT_TREE: dcb1c6d80de1e28a0f442e30cba8ddadb15dc581
          NVPN_EXPECTED_FIPS_VERSION: 0.4.107
          NVPN_ARM64_BUILD_OWNER: nvpn-4119-final-arm64
          NVPN_LINUX_MUSL_IMAGE: messense/rust-musl-cross:aarch64-musl
          NVPN_LINUX_ARM64_SMOKE_IMAGE: ubuntu:24.04
        run: |
          set -euo pipefail
          scripts/build-linux-arm64-cli-gate.sh "$RUNNER_TEMP/nvpn-arm64-final" 2>&1 | tee "$RUNNER_TEMP/nvpn-arm64-controller.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: final-arm64-cli-4dfbc7f9
          path: |
            ${{ runner.temp }}/nvpn-arm64-final
            ${{ runner.temp }}/nvpn-arm64-controller.log
            ${{ runner.temp }}/nvpn-bounded-bin/docker
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
